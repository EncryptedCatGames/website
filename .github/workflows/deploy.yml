name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      - name: Check whether Pages is enabled
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          error_file="$RUNNER_TEMP/pages-status-error.txt"
          if pages_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>"$error_file"); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            node scripts/pages-config.mjs "$pages_url" >> "$GITHUB_OUTPUT"
          elif grep -Fq '(HTTP 404)' "$error_file"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo '### Build validated; deployment is not enabled' >> "$GITHUB_STEP_SUMMARY"
            echo 'Enable GitHub Pages with GitHub Actions in repository settings, then rerun this workflow. Private repositories require a supported GitHub plan.' >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$error_file" >&2
            exit 1
          fi
      - run: bun run test
      - name: Build and verify for the published Pages URL
        run: |
          bun run build
          bun run verify
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.site_url }}
          SITE_BASE: ${{ vars.SITE_BASE || steps.pages.outputs.site_base }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist
  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
