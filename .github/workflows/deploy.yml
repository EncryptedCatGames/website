name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      - run: bun run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
      - run: bun run verify
      - name: Check whether Pages is enabled
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          error_file="$RUNNER_TEMP/pages-status-error.txt"
          if gh api "repos/$GITHUB_REPOSITORY/pages" --silent 2>"$error_file"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif grep -Fq '(HTTP 404)' "$error_file"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo '### Build validated; deployment is not enabled' >> "$GITHUB_STEP_SUMMARY"
            echo 'Enable GitHub Pages with GitHub Actions in repository settings, then rerun this workflow. Private repositories require a supported GitHub plan.' >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$error_file" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist
  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
